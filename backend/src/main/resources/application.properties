# ── Database (Supabase PostgreSQL) ──────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://db.gjbxnqqzmujziwimrzms.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Shreyas@132007}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ─────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Jackson (Date handling) ─────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT Configuration ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:CycleTrackerSuperSecret2024PinkRoseJWTAuthKey!@#456789}
app.jwt.expiration=86400000

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.cycletracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
